services:
  devils-in-the-details:
    # Pulls the image GitHub Actions builds and publishes automatically on every push to main.
    # Replace YOUR-GITHUB-USERNAME and YOUR-REPO-NAME below.
    image: ghcr.io/sideways258/devilsite:latest
    container_name: devils-in-the-details
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "8088:8080"   # host 8088 -> container 8080 (Node server); change 8088 to any free port
    # The game's multiplayer uses WebSockets on this same port — if you put this
    # behind a reverse proxy, make sure it forwards Upgrade/Connection headers.

# --- Alternative: build locally from the repo instead of pulling from GHCR ---
# Comment out "image:" above and uncomment "build:" below if you'd rather
# build the image on the Unraid box itself (e.g. no internet access to GHCR).
#
#    build: .
